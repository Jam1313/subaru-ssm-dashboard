name: Build APK

on:
  push:
    branches: [ main, master, beta/0.9 ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SUBARU_RELEASE_STORE }}" | base64 --decode > my-release-key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease \
            -PSUBARU_RELEASE_STORE=my-release-key.jks \
            -PSUBARU_RELEASE_PASSWORD="${{ secrets.SUBARU_RELEASE_PASSWORD }}" \
            -PSUBARU_RELEASE_ALIAS="${{ secrets.SUBARU_RELEASE_ALIAS }}"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
